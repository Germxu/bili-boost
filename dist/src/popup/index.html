<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bili Boost</title>
    <script type="module" crossorigin src="/assets/index.html-b5yW56w9.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/constants-CvQD--cu.js">
    <link rel="stylesheet" crossorigin href="/assets/index-DaC4hv_v.css">
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="logo">B</div>
        <div>
          <h1>Bili Boost</h1>
          <p>B站功能优化</p>
        </div>
      </header>
      <main id="feature-list" class="list"></main>
      <section class="settings-section">
        <h2>滚轮倍速设置</h2>
        <label class="setting-row">
          <span>记住倍速</span>
          <input id="speed-remember" type="checkbox" />
        </label>
        <p class="hint">悬停「倍速」按钮滚动调速（0.25x–5x）：2x 内每档 0.05x，2x 以上每档 0.3x；右键恢复 1x。倍速对全 B站生效，开启记住后通过 Chrome 账号云同步。</p>
      </section>
      <section class="settings-section">
        <h2>视频帧读取</h2>
        <button id="capture-frame" class="capture-btn" type="button">截取当前帧</button>
        <p class="hint">点击播放器左下角时间戳旁的相机按钮，或点此按钮，将当前画面保存为 PNG。无需开关，装好即可用。</p>
      </section>
      <footer id="status" class="status"></footer>
    </div>
  </body>
