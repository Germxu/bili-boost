<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bili Boost</title>
  <script type="module" crossorigin src="/assets/index.html-D8MJfqz1.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/constants-H-zDytsM.js">
  <link rel="stylesheet" crossorigin href="/assets/index-DCnUyB88.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <img class="logo" src="/icons/icon128.png" alt="Bili Boost" />
      <div>
        <h1>Bili Boost</h1>
      </div>
    </header>
    <main id="feature-list" class="list"></main>
    <section class="settings-section">
      <h2>滚轮倍速设置</h2>
      <label class="setting-row">
        <span>记住倍速</span>
        <span class="switch">
          <input id="speed-remember" class="switch-input" type="checkbox" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
      </label>
      <p class="hint">悬停「倍速」按钮滚动调速（0.25x–5x），右键恢复 1x。倍速对全站生效；开启记住后 Chrome 账号也会同步。
      </p>
    </section>
    <section class="settings-section">
      <h2>视频帧读取</h2>
      <button id="capture-frame" class="capture-btn" type="button">截取当前帧</button>
      <p class="hint">点击播放器左下角的相机按钮，或点此按钮截取画面。</p>
    </section>
    <footer id="status" class="status"></footer>
  </div>
</body>

</html>
